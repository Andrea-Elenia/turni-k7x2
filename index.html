// Determina se un turno è mattina ('m'), pomeriggio ('p') o intera giornata ('mp')
const getShiftType = a => {
  if(!a || !a.length) return 'm';
  const hasM = a.some(s => s[0] < 840);
  const hasP = a.some(s => s[1] > 840 || s[0] >= 840);
  if(hasM && hasP || a.length > 1) return 'mp';
  return a[0][0] < 840 ? 'm' : 'p';
};

{const t=dd(today);let k=D.weeks.findIndex(w=>t>=dd(w.start)&&t<new Date(+dd(w.start)+7*864e5));wi=k<0?(t<dd(D.weeks[0].start)?0:D.weeks.length-1):k}

function getShifts(wStart, date, p){
  if(overrides[wStart] && overrides[wStart][date] && overrides[wStart][date][p] !== undefined){
    return overrides[wStart][date][p];
  }
  const dayObj = D.weeks.find(w=>w.start===wStart)?.days.find(d=>d.date===date);
  return dayObj ? dayObj.shifts[p] : undefined;
}

// ---- Weekend: domeniche lavorative e weekend liberi (dati da Excel + previsione) ----
const W0=dd(D.weeks[0].start);
const wIdx=s=>Math.round((dd(s)-W0)/864e5/7);
const isoL=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
const addD=(s,n)=>{const x=dd(s);x.setDate(x.getDate()+n);return isoL(x)};
const tl=isoL(new Date());
const has=a=>!!(a&&a.length);
let wkOpen=null;

// Cerca la ricorrenza più breve (1-8 settimane) coerente con TUTTE le settimane osservate
function findCycle(obs){
  if(obs.length<3)return null;
  const span=obs[obs.length-1].i-obs[0].i+1;
  for(let p=1;p<=8&&p<=span;p++){
    const pat={},cnt={};let ok=true;
    for(const o of obs){const k=o.i%p;if(k in pat){if(pat[k]!==o.v){ok=false;break}cnt[k]++}else{pat[k]=o.v;cnt[k]=1}}
    if(ok&&Object.keys(pat).length===p)return{p,pat,sure:Object.values(cnt).every(c=>c>=2)};
  }
  return null;
}
function wkData(p){
  const S=D.weeks.map((w,k)=>({i:wIdx(w.start),k,w,sat:has(getShifts(w.start,addD(w.start,5),p)),sun:has(getShifts(w.start,addD(w.start,6),p))}));
  const last=S[S.length-1];
  const build=(hit,cyc,hitPat)=>{
    const it=[];
    S.forEach(x=>{if(hit(x)){const sa=addD(x.w.start,5),su=addD(x.w.start,6);if(su>=tl)it.push({known:true,k:x.k,sat:sa,sun:su,sd:getShifts(x.w.start,sa,p),ud:getShifts(x.w.start,su,p)})}});
    if(cyc)for(let i=last.i+1;i<=last.i+40;i++){if(hitPat(cyc.pat[i%cyc.p])){const st=addD(last.w.start,7*(i-last.i)),su=addD(st,6);if(su>=tl)it.push({known:false,sat:addD(st,5),sun:su})}}
    return it.sort((a,b)=>a.sun<b.sun?-1:1).slice(0,5);
  };
  const isSun=v=>v===true,isFree=v=>v==='--';
  const cs=S.some(x=>x.sun)?findCycle(S.map(x=>({i:x.i,v:x.sun}))):null;
  const cf=S.some(x=>!x.sat&&!x.sun)?findCycle(S.map(x=>({i:x.i,v:(x.sat?'W':'-')+(x.sun?'W':'-')}))):null;
  return{a:{items:build(x=>x.sun,cs,isSun),cyc:cs,hit:isSun,any:S.some(x=>x.sun)},b:{items:build(x=>!x.sat&&!x.sun,cf,isFree),cyc:cf,hit:isFree,any:S.some(x=>!x.sat&&!x.sun)}};
}
const wl=(sat,sun)=>{const a=dd(sat),b=dd(sun);return a.getMonth()===b.getMonth()?`${a.getDate()}–${b.getDate()} ${MN[b.getMonth()]}`:`${a.getDate()} ${MN[a.getMonth()]}–${b.getDate()} ${MN[b.getMonth()]}`};
const wl2=(sat,sun)=>{const a=dd(sat),b=dd(sun);return `Sab ${a.getDate()}${a.getMonth()===b.getMonth()?'':' '+MN[a.getMonth()]} – Dom ${b.getDate()} ${MN[b.getMonth()]}`};
const rel=sat=>{const d=Math.round((dd(sat)-dd(tl))/864e5);return d<0?'in corso':d===0?'da oggi':d===1?'da domani':d<14?'tra '+d+' giorni':'tra '+Math.round(d/7)+' settimane'};

function recTxt(o){
  const c=o.cyc;if(!c)return '';
  const k=Object.values(c.pat).filter(o.hit).length;
  const t=k===1?(c.p===1?'ogni settimana':'ogni '+c.p+' settimane'):k+' ogni '+c.p+' settimane';
  return `<div class="rc">Ricorrenza: <b>${t}</b> <span class="bd ${c.sure?'ok':'pr'}">${c.sure?'confermata':'ipotesi'}</span></div>`;
}
function tile(k,ico,title,o){

    `<span class="mo">${wkOpen===k?'Chiudi ▴':'Vedi le prossime ▾'}</span></button>`;

function panel(k,title,o){
  const rows=o.items.length?o.items.map(it=>{
    const det=it.known?(k==='a'?`Sab ${has(it.sd)?fs(it.sd):'riposo'} · Dom ${fs(it.ud)}`:'Sabato e domenica a casa'):(k==='a'?'orari da definire':'');

    :'<div class="mu" style="margin:8px 0">Nessun weekend di questo tipo in arrivo.</div>';
  const rc=o.cyc?recTxt(o):`<div class="rc">${o.any?'Ricorrenza non ancora chiara dai turni importati: nessuna previsione.':(k==='a'?'Nessuna domenica lavorativa nei turni importati.':'Nessun weekend completamente libero nei turni importati.')}</div>`;
  return `<div class="wp ${k}"><div class="ph">${title}</div>${rc}${rows}<div class="ws" style="margin-top:8px">Tocca una data “Da Excel” per aprire quella settimana. “Previsione” = stimata dalla ricorrenza dei turni importati.</div></div>`;

function draw(){
  const w=D.weeks[wi],mine=person===me;let tot=0,h='';
  w.days.forEach((d,i)=>{
    const sh=getShifts(w.start, d.date, person);
    if(sh)tot+=hrs(sh);
    let c='';
    
    const currentDayShifts = {};
    D.people.forEach(n=>{
      const s = getShifts(w.start, d.date, n);
      if(s) currentDayShifts[n] = s;
    });

    if(sh){
      // Raggruppiamo i segmenti di sovrapposizione per ciascun collega in un'unica voce
      const colleagueMap = {};
      Object.keys(currentDayShifts).forEach(n => {
        if(n === person) return;
        const overlapSegments = ov(sh, currentDayShifts[n]);
        if(overlapSegments.length > 0) {
          colleagueMap[n] = overlapSegments;
        }
      });

      const L = Object.keys(colleagueMap).map(n => ({
        n,
        segments: colleagueMap[n],
        full: currentDayShifts[n],
        type: getShiftType(currentDayShifts[n])
      })).sort((a,b) => a.segments[0][0] - b.segments[0][0]);

      c = L.length ? `<div class="mu" style="margin-top:8px">Con te in questa fascia (${L.length})</div><div class="ch">${L.map(item => `<span class="${item.type}">${item.n} · ${fs(item.full)}${fs(item.segments)===fs(item.full)?'':' <small>('+fs(item.segments)+')</small>'}</span>`).join('')}</div>` : '<div class="mu" style="margin-top:8px">Nessun collega in sovrapposizione</div>';
    }
    
    const isOff = !sh || sh.length === 0;

    h+=`<div class="card${d.date===today?' t':''}${isOff?' off-card':''}"><div class="h"><span class="d">${lab(d.date)}</span><span class="mu">${d.date===today?'Oggi':''}</span></div>
    <div class="s${sh?'':' off'}">${sh?sgs(sh):'Riposo'}</div>${c}
    ${d.note.map(n=>`<div class="n">Nota del giorno: ${n}</div>`).join('')}
    ${mine?`<button class="sm" onclick="openF(${i})">⇄ Modifica / Scambia turno</button><div id="f${i}"></div>`:''}</div>`});
  $('#hrs').textContent=(tot/60).toLocaleString('it-IT',{maximumFractionDigits:1});
  $('#out').innerHTML=h;
  $('#src').textContent=w.src?`Fonte: ${w.src} · importato il ${itd(w.imp)}`:'';
  $('#me').textContent=mine?'Modalità personale attiva: puoi modificare e scambiare i turni':'Imposta il nome come “me” per gestire i turni';
  $('#bm').textContent=mine?'Non sono io':'Sono io';
  renderWk();
}

function openF(i){
  const w=D.weeks[wi], d=w.days[i], el=$('#f'+i);
  if(el.innerHTML){el.innerHTML='';return}
  
  const sh=getShifts(w.start, d.date, person);
  const myIsMorning = sh && sh.length > 0 && sh[0][0] < 840;

  const currentDayShifts = {};
  D.people.forEach(n=>{
    const s = getShifts(w.start, d.date, n);
    if(s) currentDayShifts[n] = s;
  });

  const colleagues = Object.keys(currentDayShifts).filter(n=>{
    if(n===person) return false;
    const cSh = currentDayShifts[n];
    if(!cSh || cSh.length===0) return false;
    const cIsMorning = cSh[0][0] < 840;
    if(sh && sh.length > 0){
      return cIsMorning !== myIsMorning;
    }
    return true;
  });

  el.innerHTML=`<div class="f">
  <label class="mu w">Scambio con collega (acquisisce il suo orario)<select id="c${i}" onchange="onColleagueChange(${i})"><option value="">— Seleziona collega —</option>${colleagues.map(n=>`<option value="${n}">${n} (${fs(currentDayShifts[n])})</option>`).join('')}</select></label>
  <label class="mu">Opzionale: Inizio<input type="time" id="a${i}"></label>
  <label class="mu">Opzionale: Fine<input type="time" id="b${i}"></label>
  <button class="p w" onclick="saveChange(${i})">Conferma e applica subito</button></div>`;
}

function onColleagueChange(i){
  const w=D.weeks[wi], d=w.days[i];
  const co = $('#c'+i).value;
  if(!co) return;
  const currentDayShifts = {};
  D.people.forEach(n=>{
    const s = getShifts(w.start, d.date, n);
    if(s) currentDayShifts[n] = s;
  });
  const coSh = currentDayShifts[co];
  if(coSh && coSh.length > 0){
    const startMins = coSh[0][0], endMins = coSh[0][1];
    const h1 = String(Math.floor(startMins/60)).padStart(2,'0'), m1 = String(startMins%60).padStart(2,'0');
    const h2 = String(Math.floor(endMins/60)).padStart(2,'0'), m2 = String(endMins%60).padStart(2,'0');
    $('#a'+i).value = `${h1}:${m1}`;
    $('#b'+i).value = `${h2}:${m2}`;
  }
}

function saveChange(i){
  const w=D.weeks[wi], d=w.days[i];
  const a=$('#a'+i).value, b=$('#b'+i).value;
  const co=$('#c'+i).value;
  
  if(!a && !b && !co){
    alert('Seleziona un collega o inserisci un orario.');
    return;
  }

  if(!overrides[w.start]) overrides[w.start] = {};
  if(!overrides[w.start][d.date]) overrides[w.start][d.date] = {};

  const currentDayShifts = {};
  D.people.forEach(n=>{
    const s = getShifts(w.start, d.date, n);
    if(s) currentDayShifts[n] = s;
  });

  const myCurrentSh = currentDayShifts[person] || [];
  const coCurrentSh = co ? (currentDayShifts[co] || []) : [];

  let newMySh = myCurrentSh;
  if(a && b){
    const minsA = parseInt(a.split(':')[0])*60 + parseInt(a.split(':')[1]);
    const minsB = parseInt(b.split(':')[0])*60 + parseInt(b.split(':')[1]);
    newMySh = [[minsA, minsB]];
  } else if(co && coCurrentSh.length > 0) {
    newMySh = coCurrentSh;
  }

  if(co){
    overrides[w.start][d.date][person] = newMySh;
    overrides[w.start][d.date][co] = myCurrentSh;
  } else if(a && b) {
    overrides[w.start][d.date][person] = newMySh;
  }

  S.set('overrides', JSON.stringify(overrides));
  draw();
}

draw();
</script></body></html>
