,DEF='Elenia';
const $=s=>document.querySelector(s);
const S={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const GN=['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
const MN=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
const f=m=>{const h=m/60|0,x=m%60;return x?h+':'+String(x).padStart(2,'0'):''+h};
const fs=a=>a.map(s=>f(s[0])+'–'+f(s[1])).join(' · ');
const hrs=a=>a.reduce((t,s)=>t+s[1]-s[0],0);
const dd=s=>new Date(s+'T00:00');
const lab=d=>{const x=dd(d);return GN[x.getDay()]+' '+x.getDate()+' '+MN[x.getMonth()]};
const itd=s=>s.split('-').reverse().join('/');
const today=new Date().toISOString().slice(0,10);
let person=S.get('p'),me=S.get('me'),wi=0,req=[];
try{req=JSON.parse(S.get('req')||'[]')}catch(e){}
if(!D.people.includes(person))person=D.people.find(p=>p.startsWith(DEF))||D.people[0];
{const t=dd(today);let k=D.weeks.findIndex(w=>t>=dd(w.start)&&t<new Date(+dd(w.start)+7*864e5));wi=k<0?(t<dd(D.weeks[0].start)?0:D.weeks.length-1):k}
$('#pp').innerHTML=D.people.map(p=>`<option>${p}</option>`).join('');
const wk=D.weeks.map((w,i)=>({w,i,past:new Date(+dd(w.start)+7*864e5)<=dd(today)}));
const opt=x=>{const a=dd(x.w.start),b=new Date(+a+6*864e5);return `<option value="${x.i}">${a.getDate()} ${MN[a.getMonth()]} – ${b.getDate()} ${MN[b.getMonth()]} ${b.getFullYear()}</option>`};
const cu=wk.filter(x=>!x.past),pa=wk.filter(x=>x.past).reverse();
$('#ww').innerHTML=(cu.length?`<optgroup label="In corso e prossime">${cu.map(opt).join('')}</optgroup>`:'')+(pa.length?`<optgroup label="Archivio">${pa.map(opt).join('')}</optgroup>`:'');
$('#pp').value=person;$('#ww').value=wi;
$('#pp').onchange=e=>{person=e.target.value;S.set('p',person);draw()};
$('#ww').onchange=e=>{wi=+e.target.value;draw()};
$('#bm').onclick=()=>{me=me===person?'':person;S.set('me',me);draw()};
const ov=(a,b)=>{const r=[];a.forEach(x=>b.forEach(y=>{const s=Math.max(x[0],y[0]),e=Math.min(x[1],y[1]);if(e>s)r.push([s,e])}));return r};
function draw(){
  const w=D.weeks[wi],mine=person===me;let tot=0,h='';
  w.days.forEach((d,i)=>{
    const sh=d.shifts[person],rq=req.filter(r=>r.p===person&&r.date===d.date);
    if(sh)tot+=hrs(sh);
    let c='';
    if(sh){const L=Object.keys(d.shifts).filter(n=>n!==person).map(n=>({n,o:ov(sh,d.shifts[n])})).filter(x=>x.o.length).sort((a,b)=>a.o[0][0]-b.o[0][0]);
      c=L.length?`<div class="mu" style="margin-top:8px">Con te in questa fascia (${L.length})</div><div class="ch">${L.map(x=>`<span>${x.n} · ${fs(x.o)}</span>`).join('')}</div>`:'<div class="mu" style="margin-top:8px">Nessun collega in sovrapposizione</div>'}
    h+=`<div class="card${d.date===today?' t':''}"><div class="h"><span class="d">${lab(d.date)}</span><span class="mu">${d.date===today?'Oggi':''}</span></div>
    <div class="s${sh?'':' off'}">${sh?fs(sh):'Riposo'}</div>${c}
    ${d.note.map(n=>`<div class="n">Nota del giorno: ${n}</div>`).join('')}
    ${rq.map(r=>`<div class="rq">Proposta di cambio: ${r.nt}${r.co?' (con '+r.co+')':''}</div>`).join('')}
    ${mine?`<button class="sm" onclick="openF(${i})">⇄ Richiedi cambio turno</button><div id="f${i}"></div>`:''}</div>`});
  $('#hrs').textContent=(tot/60).toLocaleString('it-IT',{maximumFractionDigits:1});
  $('#out').innerHTML=h;
  $('#src').textContent=w.src?`Fonte: ${w.src} · importato il ${itd(w.imp)}`:'';
  $('#me').textContent=mine?'Modalità personale attiva: puoi proporre cambi turno':'Imposta il nome come “me” per proporre cambi';
  $('#bm').textContent=mine?'Non sono io':'Sono io';
  const mr=req.filter(r=>r.p===me);
  $('#rl').innerHTML=mine&&mr.length?`<h1 style="margin-top:20px">Le mie richieste</h1>`+mr.map(r=>`<div class="card"><div class="d">${lab(r.date)}</div><div class="mu">Da ${r.old} a <b>${r.nt}</b>${r.co?' · con '+r.co:''}</div>
  <button class="sm p" style="width:auto" onclick="send('${r.id}')">Invia</button><button class="sm" style="width:auto" onclick="del('${r.id}')">Elimina</button></div>`).join(''):''}
function openF(i){const d=D.weeks[wi].days[i],el=$('#f'+i);if(el.innerHTML){el.innerHTML='';return}
  el.innerHTML=`<div class="f"><label class="mu">Nuovo inizio<input type="time" id="a${i}"></label><label class="mu">Nuova fine<input type="time" id="b${i}"></label>
  <label class="mu w">Scambio con (facoltativo)<select id="c${i}"><option value="">—</option>${Object.keys(d.shifts).filter(n=>n!==person).map(n=>`<option>${n}</option>`).join('')}</select></label>
  <button class="p w" onclick="addR(${i})">Salva proposta</button></div>`}
function addR(i){const d=D.weeks[wi].days[i],a=$('#a'+i).value,b=$('#b'+i).value;if(!a||!b){alert('Inserisci inizio e fine del nuovo orario.');return}
  const r={id:'r'+Date.now(),p:person,date:d.date,old:d.shifts[person]?fs(d.shifts[person]):'riposo',nt:a.replace(/^0/,'')+'–'+b.replace(/^0/,''),co:$('#c'+i).value};
  req.push(r);S.set('req',JSON.stringify(req));draw();send(r.id)}
function del(id){req=req.filter(r=>r.id!==id);S.set('req',JSON.stringify(req));draw()}
async function send(id){const r=req.find(x=>x.id===id);if(!r)return;
  const t=`Richiesta cambio turno – ${r.p}, ${lab(r.date)}: da ${r.old} a ${r.nt}${r.co?' (scambio con '+r.co+')':''}.`;
  try{if(navigator.share){await navigator.share({text:t})}else{await navigator.clipboard.writeText(t);alert('Testo copiato negli appunti.')}}catch(e){}}
draw();
</script></body></html>
